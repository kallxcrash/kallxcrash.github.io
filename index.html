<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body{
            background: url('galaxy.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .login{
            background: rgba(15, 14, 14, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        h2{
            color: rgb(23, 247, 2);
            font-weight: 800;
            font-size: xx-large;
        }

        input[type="text"]{
            margin: 10px 0;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.63);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            color: white;
        }

        input::placeholder{
            color: white;
        }

        #boton{
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: rgb(23, 247, 2);
            color: black;
            font-weight: 700;
            font-size: large;
            cursor: pointer;
        }

        #loginStatus{
            color: white;
            height: 20px;
        }
    </style>

</head>
<body>

<div class="login">

    <h2>SIGN IN</h2>

    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input id="boton" type="submit" value="LOGIN">
    </form>

    <p id="loginStatus"></p>

</div>

<script src="script.js"></script>

</body>
</html>
